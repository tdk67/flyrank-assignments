version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: flyrank_scraper_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-flyrank_scraper}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-migrate:
    build:
      context: ./db
      dockerfile: migrate.Dockerfile
    container_name: flyrank_scraper_migrate
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-flyrank_scraper}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.xml
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
