# Server Port (Port 8003 to run side-by-side with 8001 & 8002)
server.port=8003

# Application Name
spring.application.name=kotlin-2.3-user-service

# Jackson JSON Configuration
# Replicate Pydantic's extra="forbid" (reject unknown JSON fields with 400/422)
spring.jackson.deserialization.fail-on-unknown-properties=true

# OpenAPI / Swagger UI Config (/docs & /swagger-ui.html)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operationsSorter=method
