# Server Port (Different port to run side-by-side)
server.port=8002

# Application Name
spring.application.name=java-21-user-service

# Java 21 Native Virtual Threads (Project Loom)
# Tomcat handles every HTTP request on a lightweight virtual thread!
spring.threads.virtual.enabled=true

# Jackson JSON Configuration
# Replicate Pydantic's extra="forbid" (reject unknown JSON fields with 400/422)
spring.jackson.deserialization.fail-on-unknown-properties=true

# OpenAPI / Swagger UI Config (/docs & /swagger-ui.html)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operationsSorter=method
